<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0e"><title>Q-Control — Oflayn</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0e;color:#f5f7fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
main{width:min(440px,100%);border:1px solid #202631;background:#0d1219;border-radius:22px;padding:30px;text-align:center}
.q{width:58px;height:58px;border-radius:18px;margin:0 auto 18px;display:grid;place-items:center;background:#7c5cff;font-weight:900;font-size:26px}
h1{font-size:20px;margin:0 0 8px}p{color:#8e99a8;font-size:13px;line-height:1.6}button{margin-top:12px;border:0;border-radius:11px;background:#7c5cff;color:#fff;padding:11px 16px;font-weight:800}
</style></head>
<body><main><div class="q">Q</div><h1>İnternet bağlantısı yoxdur</h1><p>Q-Control-un canlı layihə statuslarını idarə etmək üçün internet bağlantısı lazımdır.</p><button onclick="location.reload()">Yenidən yoxla</button></main></body>
</html>
